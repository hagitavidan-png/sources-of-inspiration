<!DOCTYPE html>
<html translate="no" class="notranslate" data-reading="slides" lang="he" dir="rtl" data-lesson-type="regular">
<head>
<meta name="google" content="notranslate">
<meta charset="UTF-8"/>
<meta name="robots" content="noindex"/>
<base href="../lessons/"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>חוויה אישית כמקור ליצירה, חלק ב: מקורות השראה</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=Heebo:wght@300;400;600;700;800&display=swap" rel="stylesheet"/>
<style>
/* ═══════════════════════════════════
   RESET & VARIABLES
═══════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f10;
  --rose:#FF4D4D;
  --gold:#c9a96e;
  --blue:#4a7fa5;
  --teal:#3dbcaa;
  --violet:#7c5cbf;
  --amber:#e8a030;
  --sage:#6aab8e;
  --white:#ffffff;
  --tp:#ffffff;--ts:#cfcfcf;--tm:#8a8a8a;
  --ease:cubic-bezier(.4,0,.2,1);
  --font-en:'Sora',sans-serif;
  --font-he:'Heebo',sans-serif;
}
html,body{
  height:100%;width:100%;overflow:hidden;
  background:var(--bg);color:var(--tp);
}
body{font-family:var(--font-en)}
body.he{font-family:var(--font-he)}

/* ═══════════════════════════════════
   HUD
═══════════════════════════════════ */
#hud{
  position:fixed;top:0;left:0;right:0;z-index:100;
  height:52px;
  background:rgba(13,13,26,.9);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.06);
  display:flex;align-items:center;gap:12px;padding:0 20px;
}
body.rtl #hud{flex-direction:row-reverse}
#hud-back{
  display:flex;align-items:center;gap:6px;
  font-size:.75rem;color:var(--tm);
  text-decoration:none;transition:color .2s;
}
#hud-back:hover{color:rgba(255,255,255,.7)}
#hud-badge{
  padding:3px 11px;border-radius:20px;
  background:rgba(255,77,77,.1);
  border:1px solid rgba(255,77,77,.22);
  font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--rose);
}
#hud-spacer{flex:1}
#hud-lang{display:flex;gap:4px}
.lang-btn{
  padding:4px 12px;border-radius:20px;
  border:1px solid rgba(255,255,255,.12);
  background:transparent;color:var(--tm);
  font-size:.7rem;letter-spacing:.06em;cursor:pointer;transition:.2s;
  font-family:inherit;
}
.lang-btn.active{
  background:rgba(201,168,76,.15);
  border-color:rgba(201,168,76,.5);
  color:var(--gold);
}
#hud-step{font-size:.7rem;color:var(--tm);letter-spacing:.04em}

/* ═══════════════════════════════════
   PROGRESS DOTS
═══════════════════════════════════ */
#progress{
  position:fixed;bottom:88px;left:50%;
  transform:translateX(-50%);
  z-index:100;display:flex;gap:7px;align-items:center;
}
.pdot{
  width:7px;height:7px;border-radius:50%;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.15);
  cursor:pointer;transition:.3s var(--ease);
}
.pdot.now{
  background:var(--rose);border-color:var(--rose);
  box-shadow:0 0 10px rgba(255,77,77,.4);
  width:22px;border-radius:4px;
}

/* ═══════════════════════════════════
   STAGE & SCREENS
═══════════════════════════════════ */
#stage{
  position:fixed;inset:52px 0 80px 0;
  overflow:hidden;
}
.screen{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:28px 24px 32px;
  opacity:0;pointer-events:none;
  transform:translateY(32px);
  transition:opacity .55s var(--ease),transform .55s var(--ease);
  text-align:center;
}
.screen.active{
  opacity:1;pointer-events:all;
  transform:translateY(0);
}
.screen.leaving{
  opacity:0;transform:translateY(-28px);
  transition:opacity .35s var(--ease),transform .35s var(--ease);
}
/* Gallery screens: top-aligned, scrollable, no button overlap */
.screen--gallery{
  justify-content:flex-start;
  align-items:center;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding-top:20px;
  padding-bottom:120px; /* extra room so content clears nav + dots */
  scrollbar-width:none;
  gap:0;
}
.screen--gallery::-webkit-scrollbar{display:none}

/* Blobs */
.blob{
  position:absolute;border-radius:50%;
  filter:blur(90px);opacity:.16;pointer-events:none;
  animation:drift 14s ease-in-out infinite alternate;
}
@keyframes drift{
  from{transform:translate(0,0) scale(1)}
  to{transform:translate(25px,18px) scale(1.07)}
}

/* ═══════════════════════════════════
   TYPOGRAPHY
═══════════════════════════════════ */
.label{
  font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--tm);margin-bottom:18px;
}
.big{
  font-size:clamp(1.7rem,4.5vw,3.2rem);
  font-weight:700;line-height:1.28;letter-spacing:-.018em;
  color:var(--tp);max-width:720px;margin-bottom:0;
}
.sub{
  font-size:clamp(.9rem,2vw,1.06rem);
  font-weight:300;color:var(--tm);
  max-width:480px;margin-top:28px;line-height:2.1;
}
.quote-text{
  font-size:clamp(1.25rem,3.5vw,2rem);
  font-style:italic;font-weight:300;
  color:var(--tp);max-width:660px;line-height:1.65;
  position:relative;
}
.quote-text::before{
  content:'\201C';position:absolute;
  left:-.45em;top:-.1em;
  font-size:3em;color:var(--gold);opacity:.25;line-height:1;
}
body.rtl .quote-text::before{left:auto;right:-.45em}
.quote-attr{
  margin-top:24px;font-size:.72rem;letter-spacing:.14em;
  color:var(--tm);text-transform:uppercase;
}

/* ═══════════════════════════════════
   CHIPS
═══════════════════════════════════ */
.chips{
  display:flex;flex-wrap:wrap;gap:10px;
  justify-content:center;max-width:640px;margin-top:26px;
}
.chip{
  padding:11px 20px;border-radius:50px;
  border:1.5px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.04);
  font-size:.92rem;color:var(--ts);
  cursor:pointer;transition:.25s var(--ease);
  user-select:none;font-family:inherit;
}
.chip:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3);color:var(--tp)}
.chip.picked{
  background:var(--rose);border-color:var(--rose);
  color:#fff;font-weight:700;
  box-shadow:0 4px 22px rgba(255,77,77,.35);
}

/* ═══════════════════════════════════
   MEMORY PART CHIPS (screen 5)
═══════════════════════════════════ */
.part-chips{
  display:flex;flex-wrap:wrap;gap:12px;
  justify-content:center;max-width:580px;margin-top:26px;
}
.part-chip{
  padding:13px 22px;border-radius:14px;
  border:1.5px solid rgba(255,255,255,.13);
  background:rgba(255,255,255,.04);
  font-size:.9rem;color:var(--ts);
  cursor:pointer;transition:.25s var(--ease);
  user-select:none;font-family:inherit;
  display:flex;align-items:center;gap:8px;
}
.part-chip:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.28);color:var(--tp)}
.part-chip.picked{
  background:rgba(255,77,77,.12);
  border-color:var(--rose);color:var(--tp);
  box-shadow:0 4px 18px rgba(255,77,77,.2);
}
.part-chip .icon{font-size:1.1rem}

/* ═══════════════════════════════════
   COMPOSITION CARDS (screen 7)
═══════════════════════════════════ */
.comp-cards{
  display:flex;gap:14px;flex-wrap:wrap;
  justify-content:center;max-width:700px;margin-top:26px;
}
.comp-card{
  width:180px;padding:20px 16px 16px;
  border-radius:16px;
  border:1.5px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.04);
  cursor:pointer;transition:.25s var(--ease);
  display:flex;flex-direction:column;align-items:center;gap:10px;
}
.comp-card:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.28)}
.comp-card.picked{
  border-color:var(--rose);
  background:rgba(255,77,77,.1);
}
.comp-card svg{width:90px;height:60px}
.comp-card span{
  font-size:.8rem;color:var(--tm);
  text-align:center;line-height:1.4;
}
.comp-card.picked span{color:#fff}

/* ═══════════════════════════════════
   INSTRUCTION BOX
═══════════════════════════════════ */
.instr-box{
  margin-top:26px;padding:22px 28px;
  border-radius:18px;
  border:1.5px solid rgba(255,255,255,.09);
  background:rgba(255,255,255,.04);
  max-width:520px;text-align:left;
}
body.rtl .instr-box{text-align:right}
.instr-box ul{list-style:none;display:flex;flex-direction:column;gap:10px}
.instr-box li{
  display:flex;align-items:flex-start;gap:10px;
  font-size:.9rem;color:var(--ts);line-height:1.55;
}
.instr-box li::before{
  content:'→';color:var(--gold);flex-shrink:0;margin-top:1px;
}
body.rtl .instr-box li::before{content:'←'}

/* ── Gallery instruction bar (top) ─────────────── */
.gal-instruction{
  width:100%;max-width:840px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  border-radius:14px;
  padding:16px 22px;
  margin-bottom:24px;
  display:flex;align-items:center;gap:12px;
  flex-shrink:0;
}
.gal-instruction .gal-eye{
  font-size:1.5rem;flex-shrink:0;
}
.gal-instruction p{
  font-size:1rem;color:var(--ts);
  line-height:1.55;text-align:left;margin:0;
  font-weight:400;
}
body.rtl .gal-instruction p{text-align:right}
.gallery{
  display:flex;gap:18px;flex-wrap:wrap;
  justify-content:center;
  max-width:880px;width:100%;
  flex-shrink:0;
}
.gal-item{
  flex:1;min-width:min(240px,calc(100% - 36px));max-width:340px;
  border-radius:16px;
  border:1.5px solid rgba(255,255,255,.13);
  cursor:pointer;transition:.3s var(--ease);
  display:flex;flex-direction:column;
  background:rgba(255,255,255,.04);
  box-shadow:0 4px 24px rgba(0,0,0,.35);
}
.gal-item:hover{
  transform:scale(1.02);
  border-color:rgba(255,255,255,.4);
  background:rgba(255,255,255,.08);
  box-shadow:0 8px 40px rgba(0,0,0,.5);
}
.gal-item img{
  width:100%;
  height:auto;
  max-height:70vh;
  object-fit:contain;
  display:block;
  background:#0d0d1a;
  border-radius:16px 16px 0 0;
}
.gal-caption{
  padding:11px 16px;
  font-size:.8rem;
  font-weight:500;
  color:var(--ts);
  background:rgba(0,0,0,.7);
  line-height:1.45;
  text-align:center;
  border-top:1px solid rgba(255,255,255,.07);
  letter-spacing:.02em;
}
.gal-ask{
  margin-top:24px;
  margin-bottom:8px;
  padding:14px 28px;
  border-radius:50px;
  border:1px dashed rgba(255,255,255,.22);
  font-size:1rem;
  color:var(--tm);
  font-style:italic;
  max-width:520px;
  flex-shrink:0;
}

/* ═══════════════════════════════════
   REFLECTION
═══════════════════════════════════ */
.ref-wrap{
  width:100%;max-width:560px;margin-top:22px;
}
.ref-area{
  width:100%;height:120px;resize:none;
  background:rgba(255,255,255,.06);
  border:1.5px solid rgba(255,255,255,.12);
  border-radius:14px;padding:15px 17px;
  color:var(--tp);font-family:inherit;
  font-size:.95rem;line-height:1.6;outline:none;transition:.2s;
}
.ref-area:focus{border-color:var(--rose);background:rgba(255,77,77,.05)}
.ref-save{
  margin-top:10px;padding:10px 26px;
  border-radius:50px;border:none;cursor:pointer;
  background:#FF4D4D;color:#fff;
  font-family:inherit;font-size:.85rem;font-weight:700;
  transition:.2s;
}
.ref-save:hover{background:#e03333}
.ref-saved{
  display:none;margin-top:8px;
  font-size:.8rem;color:var(--tm);
}

/* ═══════════════════════════════════
   CLOSING
═══════════════════════════════════ */
.close-badge {
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 0; flex-shrink: 0; font-size: 2rem;
}
.close-btns{
  display:flex;gap:12px;flex-wrap:wrap;
  justify-content:center;margin-top:26px;
}
.btn-outline{
  padding:12px 24px;border-radius:50px;
  border:1.5px solid rgba(255,255,255,.2);
  background:transparent;color:var(--ts);
  font-family:inherit;font-size:.88rem;cursor:pointer;
  text-decoration:none;transition:.2s;
}
.btn-outline:hover{border-color:rgba(255,255,255,.5);color:var(--tp)}
.btn-red{
  padding:12px 24px;border-radius:50px;border:none;
  background:#FF4D4D;
  color:#fff;font-family:inherit;font-size:.88rem;
  font-weight:700;cursor:pointer;transition:.2s;
  text-decoration:none;
}
.btn-red:hover{background:#e03333}

/* ═══════════════════════════════════
   NAV BAR
═══════════════════════════════════ */
#nav-bar{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  height:80px;
  display:flex;align-items:center;justify-content:center;gap:14px;
  padding:0 24px;
  background:rgba(13,13,26,.95);
  border-top:1px solid rgba(255,255,255,.06);
  backdrop-filter:blur(12px);
}
#back-btn{
  width:48px;height:48px;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.06);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--tm);
  font-size:1.1rem;transition:.2s;flex-shrink:0;
}
#back-btn:hover{background:rgba(255,255,255,.14);color:var(--tp)}
#back-btn:disabled{opacity:.18;cursor:default;pointer-events:none}
#next-btn{
  padding:15px 52px;
  background:#FF4D4D;
  border:none;border-radius:50px;
  color:#fff;font-family:inherit;
  font-size:1rem;font-weight:800;
  letter-spacing:.03em;cursor:pointer;
  box-shadow:0 8px 32px rgba(255,77,77,.32);
  transition:.25s var(--ease);white-space:nowrap;
}
#next-btn:hover{
  background:#e03333;transform:translateY(-3px);
  box-shadow:0 12px 40px rgba(255,77,77,.42);
}
#next-btn:active{transform:translateY(0)}
#next-btn.gold-btn{
  background:#FF4D4D;color:#fff;
  box-shadow:0 8px 32px rgba(255,77,77,.32);
}

/* Fullscreen btn */
#fs-btn{
  position:fixed;top:60px;right:16px;z-index:200;
  width:36px;height:36px;border-radius:8px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.05);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--tm);
  font-size:.85rem;transition:.2s;
}
#fs-btn:hover{color:var(--tp);background:rgba(255,255,255,.12)}

/* ═══════════════════════════════════
   RESPONSIVE
═══════════════════════════════════ */
@media(max-width:760px){
  .gallery{
    flex-direction:column;
    align-items:center;
    gap:14px;
  }
  .gal-item{
    max-width:min(94vw,480px);
    min-width:unset;
    width:100%;
    flex:none;
  }
  .gal-item img{
    aspect-ratio:unset;
    height:auto;
    max-height:70vh;
  }
  .screen--gallery{
    padding-left:14px;
    padding-right:14px;
    padding-bottom:130px;
  }
  .gal-instruction{
    margin-bottom:16px;
  }
}
@media(max-width:600px){
  .big{font-size:clamp(1.6rem,8vw,2.4rem)}
  .comp-cards{gap:8px}
  .comp-card{width:140px}
  #next-btn{padding:14px 36px;font-size:.95rem}
  .gal-instruction{padding:10px 14px}
  .gal-ask{padding:10px 18px;font-size:.88rem}
}

/* ═══════════════════════════════════
   RTL — full direction logic
═══════════════════════════════════ */
/* 1. Root direction */
body.rtl{ direction:rtl; }
/* 2. Text alignment */
body.rtl .label,
body.rtl .big,
body.rtl .sub,
body.rtl .gal-ask,
body.rtl .gal-caption,
body.rtl .instr-box,
body.rtl .ref-wrap,
body.rtl .quote-attr,
body.rtl .close-btns { text-align:right; }
body.rtl .quote-text  { text-align:center; }
body.rtl .quote-text::before { left:auto; right:-.45em; }
/* 3. Instruction list arrows */
body.rtl .instr-box li::before { content:'←'; }
/* 4. HUD order */
body.rtl #hud { flex-direction:row-reverse; }
/* 5. Back-btn arrow flip */
body.rtl #back-btn svg { transform:scaleX(-1); }
/* 6. Progress dots right-to-left */
body.rtl #progress { flex-direction:row-reverse; direction:rtl; }
/* 7. Gallery instruction */
body.rtl .gal-instruction { flex-direction:row-reverse; }
body.rtl .gal-instruction p { text-align:right; }
/* 8. Chips / comp-cards */
body.rtl .chips,
body.rtl .part-chips,
body.rtl .comp-cards { flex-direction:row-reverse; flex-wrap:wrap; }
/* 9. Closing buttons */
body.rtl .close-btns { flex-direction:row-reverse; }
/* 10. Lang toggle — עברית on right in RTL */
body.rtl #hud-lang { flex-direction:row-reverse; }

/* ── Mobile gallery: single column so no artwork is ever cut ── */
@media (max-width: 520px) {
  .gallery {
    flex-direction: column !important;
    align-items: center !important;
  }
  .gal-item {
    min-width: unset !important;
    max-width: 100% !important;
    width: 100% !important;
  }
  .gal-item img {
    max-height: 55vw !important;
    height: auto !important;
    object-fit: contain !important;
  }
}


/* ── QA: Gallery mobile — single column, no artwork cropping ── */
@media (max-width: 600px) {
  .gallery {
    flex-direction: column !important;
    align-items: center !important;
    gap: 14px !important;
  }
  .gal-item {
    min-width: unset !important;
    max-width: 100% !important;
    width: 100% !important;
    flex: none !important;
  }
  .gal-item img {
    aspect-ratio: unset !important;
    object-fit: contain !important;
    max-height: 60vw !important;
    height: auto !important;
    background: #0d0d1a;
  }
  .screen--gallery {
    padding-bottom: 140px !important;
  }
}


/* ── QA: fs-btn RTL positioning ── */
body.rtl #fs-btn,
html[lang="he"] #fs-btn {
  right: auto !important;
  left: 16px !important;
}


/* ── QA: progress dots clearance on gallery screens ── */
.screen--gallery {
  padding-bottom: 140px;
}


/* ── Lesson 1.1: short notes on the personal screens ── */
.note-area{height:96px}
/* ── Lesson 1.1: drawn frame for a work without an image ── */
.gal-sketch{
  aspect-ratio:4/5;max-height:70vh;width:100%;
  display:flex;align-items:center;justify-content:center;
  background:#0d0d1a;border-radius:16px 16px 0 0;
}
.gal-sketch svg{width:62%;height:auto;opacity:.8}
@media (max-width:600px){ .gal-sketch{max-height:60vw} }
/* ── Lesson 1.1: ordered choices read right to left (colour, line, space) ── */
body.rtl #comp-cards,
body.rtl #look-chips{flex-direction:row !important}
/* ── Lesson 1.1: three direction cards stay on one row on phones ── */
@media (max-width:600px){
  .comp-cards{flex-wrap:nowrap !important;gap:8px}
  .comp-card{width:auto;flex:1 1 0;padding:14px 6px 12px}
  .comp-card svg{width:64px;height:44px}
}

<!-- Fullscreen -->
<button id="fs-btn" title="מסך מלא" onclick="toggleFS()">⛶</button>

<!-- ── STAGE ─────────────────────────── -->
<main id="stage">

  <!-- ══ S0 · Opening ══ -->
  <section class="screen active" id="s0" data-bg="#120a10">
    <div class="blob" style="width:500px;height:500px;background:var(--rose);top:-120px;left:-80px"></div>
    <div class="blob" style="width:320px;height:320px;background:var(--amber);bottom:0;right:-60px;animation-delay:5s"></div>
    <p class="label"></p>
    <h1 class="big"></h1>
    <p class="sub"></p>
  </section>

  <!-- ══ S1 · Remember ══ -->
  <section class="screen" id="s1" data-bg="#0d0d1a">
    <div class="blob" style="width:420px;height:420px;background:var(--violet);bottom:-80px;left:-60px;opacity:.14"></div>
    <p class="label"></p>
    <h2 class="big"></h2>
    <p class="sub"></p>
  </section>

  <!-- ══ S2 · Choose a direction (selection) ══ -->
  <section class="screen" id="s2" data-bg="#120a10">
    <div class="blob" style="width:420px;height:420px;background:var(--rose);bottom:-80px;left:-60px;opacity:.12"></div>
    <p class="label"></p>
    <h2 class="big"></h2>
    <p class="sub"></p>
    <div class="comp-cards" id="comp-cards">
      <div class="comp-card" onclick="pickComp(this)">
        <svg viewBox="0 0 90 60">
          <circle cx="32" cy="30" r="17" fill="rgba(232,160,48,.35)"/>
          <circle cx="54" cy="26" r="13" fill="rgba(255,77,77,.35)"/>
          <circle cx="50" cy="42" r="9" fill="rgba(124,92,191,.4)"/>
        </svg>
        <span id="cc0"></span>
      </div>
      <div class="comp-card" onclick="pickComp(this)">
        <svg viewBox="0 0 90 60">
          <path d="M6 34C16 14 24 50 36 30S54 12 62 32 78 46 86 22" fill="none" stroke="rgba(245,243,239,.55)" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M10 46L22 40 30 48 44 38" fill="none" stroke="rgba(245,243,239,.3)" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
        <span id="cc1"></span>
      </div>
      <div class="comp-card" onclick="pickComp(this)">
        <svg viewBox="0 0 90 60">
          <rect x="8" y="10" width="34" height="34" rx="3" fill="none" stroke="rgba(245,243,239,.45)" stroke-width="1.5"/>
          <rect x="62" y="38" width="12" height="12" rx="2" fill="none" stroke="rgba(245,243,239,.45)" stroke-width="1.5"/>
          <circle cx="70" cy="16" r="3" fill="rgba(245,243,239,.45)"/>
        </svg>
        <span id="cc2"></span>
      </div>
    </div>
  </section>

  <!-- ══ S3 · Develop one work ══ -->
  <section class="screen" id="s3" data-bg="#0f0d12">
    <div class="blob" style="width:460px;height:460px;background:var(--amber);top:-100px;left:-80px;opacity:.1"></div>
    <p class="label"></p>
    <h2 class="big"></h2>
    <p class="sub"></p>
    <div class="instr-box"><ul><li></li><li></li><li></li></ul></div>
  </section>

  <!-- ══ S4 · Pause ══ -->
  <section class="screen" id="s4" data-bg="#07070d">
    <div class="blob" style="width:520px;height:520px;background:var(--blue);top:50%;left:50%;transform:translate(-50%,-50%);opacity:.07"></div>
    <p class="label"></p>
    <h2 class="big"></h2>
    <p class="sub"></p>
  </section>

  <!-- ══ S5 · Look at the process ══ -->
  <section class="screen" id="s5" data-bg="#0a0c10">
    <div class="blob" style="width:420px;height:420px;background:var(--gold);bottom:-60px;right:-60px;opacity:.1"></div>
    <p class="label"></p>
    <h2 class="big"></h2>
    <div class="instr-box"><ul><li></li><li></li><li></li></ul></div>
  </section>

  <!-- ══ S6 · Reflection ══ -->
  <section class="screen" id="s6" data-bg="#0d0a10">
    <div class="blob" style="width:380px;height:380px;background:var(--rose);bottom:-80px;left:-60px;opacity:.15"></div>
    <p class="label"></p>
    <h2 class="big"></h2>
    <div class="ref-wrap">
      <textarea class="ref-area" id="reflection-input"></textarea>
      <br/>
      <button class="ref-save" onclick="saveRef()"></button>
      <p class="ref-saved" id="ref-saved-msg"></p>
    </div>
  </section>

  <!-- ══ S7 · Closing ══ -->
  <section class="screen" id="s7" data-bg="#0d0d1a">
    <div class="blob" style="width:480px;height:480px;background:var(--rose);top:-100px;left:-80px;opacity:.14"></div>
    <div class="blob" style="width:300px;height:300px;background:var(--gold);bottom:-60px;right:-60px;opacity:.1;animation-delay:4s"></div>
    <div class="close-badge">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M12 2l2.4 7.4H22l-6 4.3 2.3 7.3L12 17l-6.3 4 2.3-7.3-6-4.3h7.6L12 2z" fill="rgba(255,255,255,.9)"/>
      </svg>
    </div>
    <p class="label"></p>
    <h2 class="big"></h2>
    <p class="sub"></p>
    <div class="close-btns">
      <a href="../course.html#unit01" class="btn-outline"></a>
      <button class="btn-red" onclick="restart()"></button>
    </div>
  </section>

</main><!-- /stage -->

<!-- Progress dots -->
<div id="progress"></div>

<!-- Nav -->
<div id="nav-bar">
  <button id="back-btn" onclick="goBack()" disabled>
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
      <path d="M11 4L6 9l5 5" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
  <button id="next-btn" onclick="advance()">← התחל</button>
</div>

<!-- ══ GLOBAL LESSON SYSTEM ══ -->
<script src="js/lesson-system.js?v=20260927-structure"></script>

<script>
/* ─── STATE ─────────────────────── */
const TOTAL = 8;   // screens 0-7
let cur  = 0;
let busy = false;
let he = (function(){ try { return (localStorage.getItem('sourcesLang') || 'en') === 'he'; } catch(e) { return false; } })();
let touchX = 0;
let choices = { look:'', experience:'', direction:'' };

/* ─── STRINGS ───────────────────── */
const T = {
  en:{
    back:'Back to Course', unit:'Personal Experience',
    s:[
      { label:'Unit: Personal Experience as a Source of Inspiration',
        big:'Back to the<br>three experiments.',
        sub:'Bring the sheets from the last lesson.' },

      { label:'Before you continue',
        big:'What did you want to pass on<br>from the experience?',
        sub:'Remember for a moment, before you choose.' },

      { label:'Lay the three sheets side by side',
        big:'Don\'t choose<br>the most beautiful one.',
        sub:'Choose the one you want to know<br>where it could go.',
        comp:['Colour','Line and movement','Space and composition'] },

      { label:'Develop',
        big:'Move to a large sheet.',
        sub:'The sketch is a starting point,<br>not a plan.',
        i:['Enlarge, move, cover.',
           'Let go of what doesn\'t work.',
           'Let the painting change.'] },

      { label:'Pause',
        big:'Stop.<br>Look at your painting.',
        sub:'What is already working?<br>What is one thing you want to strengthen?' },

      { label:'Looking back',
        big:'Place the experiments<br>next to the work.',
        i:['What changed along the way?',
           'Which visual choice became important?',
           'What appeared that you didn\'t plan?'] },

      { label:'Reflection',
        big:'What appeared<br>that you didn\'t plan?',
        ph:'I didn\'t plan that…', save:'Save ✓', saved:'Saved.' },

      { label:'Lesson complete',
        big:'The experience was<br>the starting point.',
        sub:'The work found<br>its own way.',
        back:'← Back to Course', again:'Start again ↺' }
    ],
    btn:['Begin →','Continue →','Choose →','Continue →','Continue →','Continue →','Finish →','']
  },
  he:{
    back:'חזרה לקורס', unit:'חוויה אישית',
    s:[
      { label:'יחידה: חוויה אישית כמקור השראה',
        big:'חוזרים לשלושת<br>הניסויים.',
        sub:'הביאו את הדפים מהשיעור הקודם.' },

      { label:'לפני שממשיכים',
        big:'מה רציתם להעביר<br>מהחוויה?',
        sub:'היזכרו לרגע, לפני שבוחרים.' },

      { label:'הניחו את שלושת הדפים זה לצד זה',
        big:'אל תבחרו<br>את היפה ביותר.',
        sub:'בחרו את זה שאתם רוצים לדעת<br>לאן הוא יכול להתפתח.',
        comp:['צבע','קו ותנועה','מרחב וקומפוזיציה'] },

      { label:'פיתוח',
        big:'עברו לדף גדול.',
        sub:'הסקיצה היא נקודת מוצא,<br>לא תוכנית.',
        i:['הגדילו, הזיזו, כסו.',
           'ותרו על מה שלא עובד.',
           'תנו לציור להשתנות.'] },

      { label:'עצרו',
        big:'עצרו.<br>הסתכלו על הציור.',
        sub:'מה כבר עובד?<br>מה דבר אחד תרצו לחזק?' },

      { label:'התבוננות',
        big:'הניחו את הניסויים<br>ליד העבודה.',
        i:['מה השתנה בדרך?',
           'איזו בחירה חזותית הפכה משמעותית?',
           'מה הופיע שלא תכננתם?'] },

      { label:'רפלקציה',
        big:'מה הופיע<br>שלא תכננתם?',
        ph:'לא תכננתי ש…', save:'שמור ✓', saved:'נשמר.' },

      { label:'השיעור הסתיים',
        big:'החוויה הייתה<br>נקודת המוצא.',
        sub:'היצירה מצאה<br>את הדרך שלה.',
        back:'חזרה לקורס →', again:'↺ מההתחלה' }
    ],
    btn:['← התחל','← המשך','← בחר','← המשך','← המשך','← המשך','← סיום','']
  }
};

/* ─── LANGUAGE ───────────────────── */
function setLang(l){
  he = (l === 'he');
  try { localStorage.setItem('sourcesLang', l); } catch(e) {}
  document.documentElement.lang = l;
  document.documentElement.dir  = he ? 'rtl' : 'ltr';
  document.body.classList.toggle('he',  he);
  document.body.classList.toggle('rtl', he);
  document.body.dir = he ? 'rtl' : 'ltr';
  const pg = document.getElementById('progress');
  if(pg) pg.style.flexDirection = he ? 'row-reverse' : 'row';
  document.querySelectorAll('#hud-lang .lang-btn').forEach(b=>{
    b.classList.toggle('active', b.textContent.trim() === (he ? 'עברית' : 'EN'));
  });
  const fs = document.getElementById('fs-btn');
  if(fs) fs.title = he ? 'מסך מלא' : 'Full screen';
  applyStrings();
  updateBtn();
  updateHud();
}

function applyStrings(){
  const d = T[he ? 'he' : 'en'];
  document.getElementById('t-back').textContent = d.back;
  document.getElementById('t-unit').textContent = d.unit;

  d.s.forEach((s,i)=>{
    const el = document.getElementById('s'+i);
    if(!el) return;

    const lbl = el.querySelector('.label') || document.getElementById('t'+i+'-label');
    if(lbl && s.label) lbl.textContent = s.label;

    const big = el.querySelector('.big') || document.getElementById('t'+i+'-big');
    if(big && s.big) big.innerHTML = s.big;

    const sub = el.querySelector('.sub');
    if(sub && s.sub) sub.innerHTML = s.sub;

    const qt = el.querySelector('.quote-text');
    if(qt && s.quote) qt.innerHTML = s.quote;
    const qa = el.querySelector('.quote-attr');
    if(qa && s.attr) qa.textContent = s.attr;

    ['cap1','cap2','cap3'].forEach(k=>{
      const e = document.getElementById('t'+i+'-'+k);
      if(e && s[k]) e.textContent = s[k];
    });
    if(s.ask){ const e=el.querySelector('.gal-ask'); if(e) e.textContent=s.ask; }

    if(s.chips){
      const btns = el.querySelectorAll('.chips .chip');
      s.chips.forEach((c,j)=>{ if(btns[j]) btns[j].textContent = c; });
    }
    if(s.comp){
      s.comp.forEach((txt,j)=>{ const sp=document.getElementById('cc'+j); if(sp) sp.textContent=txt; });
    }
    if(s.i){
      const items = el.querySelectorAll('.instr-box li');
      s.i.forEach((txt,j)=>{ if(items[j]) items[j].textContent = txt; });
    }

    if(s.ph){ const ta=el.querySelector('textarea'); if(ta) ta.placeholder=s.ph; }
    if(s.save){ const sb=el.querySelector('.ref-save'); if(sb) sb.textContent=s.save; }
    if(s.saved){ const sm=document.getElementById('ref-saved-msg'); if(sm) sm.textContent=s.saved; }

    if(s.back){ const ab=el.querySelector('.close-btns a'); if(ab) ab.textContent=s.back; }
    if(s.again){ const ag=el.querySelector('.close-btns button'); if(ag) ag.textContent=s.again; }
  });
}

/* ─── HUD ────────────────────────── */
function updateHud(){
  const display = cur < TOTAL-1 ? (cur+1)+' / '+(TOTAL-1) : '✓';
  document.getElementById('hud-step').textContent = display;
}

/* ─── DOTS + BUTTON — lesson-system.js ─── */
function buildDots()  { LS_buildDots(TOTAL, go); }
function refreshDots(){ LS_refreshDots(cur); }
function updateBtn()  { updateLessonBtn(document.getElementById('next-btn'), T[he ? 'he' : 'en'].btn, cur, TOTAL-2, he); }

/* ─── BACK BUTTON ───────────────── */
function updateBackBtn(){ document.getElementById('back-btn').disabled = (cur === 0); }

/* ─── BG ─────────────────────────── */
function setBg(idx){
  const el = document.getElementById('s'+idx);
  if(el) document.body.style.background = el.dataset.bg || '#0d0d1a';
}

/* ─── NAVIGATION ────────────────── */
function go(n){
  if(n<0||n>=TOTAL||busy) return;
  busy = true;
  const prev = document.getElementById('s'+cur);
  prev.classList.add('leaving');
  setTimeout(()=>{
    prev.classList.remove('active','leaving');
    cur = n;
    const next = document.getElementById('s'+cur);
    next.classList.add('active');
    next.scrollTop = 0;
    setBg(cur);
    refreshDots();
    updateBtn();
    updateHud();
    updateBackBtn();
    busy = false;
  }, 380);
}
function advance(){ if(busy) return; if(cur === TOTAL-1) finishLesson(); else go(cur+1); }
function goBack(){  if(!busy && cur>0) go(cur-1); }

function restart(){
  choices = { look:'', experience:'', direction:'' };
  document.querySelectorAll('.chip,.comp-card').forEach(c=>c.classList.remove('picked'));
  document.querySelectorAll('textarea').forEach(t=>{ t.value=''; });
  const sm = document.getElementById('ref-saved-msg'); if(sm) sm.style.display = 'none';
  go(0);
}

/* ─── INTERACTIONS ──────────────── */
function pick(btn, groupId){
  document.querySelectorAll('#'+groupId+' .chip').forEach(c=>c.classList.remove('picked'));
  btn.classList.add('picked');
  if(groupId==='look-chips') choices.look = btn.textContent;
  if(groupId==='exp-chips')  choices.experience = btn.textContent;
}

function pickComp(card){
  document.querySelectorAll('.comp-card').forEach(c=>c.classList.remove('picked'));
  card.classList.add('picked');
  choices.direction = card.querySelector('span').textContent;
}

function saveRef(){
  const txt = document.getElementById('reflection-input').value.trim();
  if(!txt) return;
  const key    = 'experience-artwork-reflection';
  const stored = JSON.parse(localStorage.getItem(key)||'[]');
  stored.push({ text:txt, date:new Date().toISOString(), choices });
  localStorage.setItem(key, JSON.stringify(stored));
  const msg = document.getElementById('ref-saved-msg');
  msg.style.display = 'block';
  msg.style.opacity = '1';
}


/* ─── FULLSCREEN ────────────────── */
function toggleFS(){
  if(!document.fullscreenElement)
    document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen();
}

/* ─── KEYBOARD ──────────────────── */
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='TEXTAREA') return;
  if(e.key===' ') { e.preventDefault(); advance(); }
  if(e.key==='ArrowRight') { e.preventDefault(); he ? goBack()  : advance(); }
  if(e.key==='ArrowLeft')  { e.preventDefault(); he ? advance() : goBack();  }
  if(e.key==='f'||e.key==='F') toggleFS();
});

/* ─── TOUCH SWIPE (RTL: swipe right = next; LTR: swipe left = next) ─── */
document.addEventListener('touchstart', e=>{ touchX = e.touches[0].clientX; });
document.addEventListener('touchend',   e=>{
  if(e.target.tagName==='TEXTAREA') return;
  const dx = e.changedTouches[0].clientX - touchX;
  if(he){ if(dx >  60) advance(); if(dx < -60) goBack(); }
  else  { if(dx < -60) advance(); if(dx >  60) goBack(); }
});

/* ─── INIT ──────────────────────── */
setLang(he ? 'he' : 'en');
document.body.classList.remove('lang-loading');
buildDots();
refreshDots();
updateBtn();
setBg(0);
updateBackBtn();
</script>
<script src="js/course-progression.js?v=20260927-copy"></script>
<script src="../js/navigation-data.js?v=20260927-nav"></script>
<script src="../js/navigation.js?v=20260927-access"></script>

</body>
