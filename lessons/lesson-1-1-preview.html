<link rel="preconnect" href="https://fonts.googleapis.com"/>

<style>
/* ═══════════════════════════════════
   RESET & VARIABLES
═══════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f10;
  --rose:#FF4D4D;
  --gold:#c9a96e;
  --blue:#4a7fa5;
  --teal:#3dbcaa;
  --violet:#7c5cbf;
  --amber:#e8a030;
  --sage:#6aab8e;
  --white:#ffffff;
  --tp:#ffffff;--ts:#cfcfcf;--tm:#8a8a8a;
  --ease:cubic-bezier(.4,0,.2,1);
  --font-en:'Sora',sans-serif;
  --font-he:'Heebo',sans-serif;
}
html,body{
  height:100%;width:100%;overflow:hidden;
  background:var(--bg);color:var(--tp);
}
body{font-family:var(--font-en)}
body.he{font-family:var(--font-he)}

/* ═══════════════════════════════════
   HUD
═══════════════════════════════════ */
#hud{
  position:fixed;top:0;left:0;right:0;z-index:100;
  height:52px;
  background:rgba(13,13,26,.9);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.06);
  display:flex;align-items:center;gap:12px;padding:0 20px;
}
body.rtl #hud{flex-direction:row-reverse}
#hud-back{
  display:flex;align-items:center;gap:6px;
  font-size:.75rem;color:var(--tm);
  text-decoration:none;transition:color .2s;
}
#hud-back:hover{color:rgba(255,255,255,.7)}
#hud-badge{
  padding:3px 11px;border-radius:20px;
  background:rgba(255,77,77,.1);
  border:1px solid rgba(255,77,77,.22);
  font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--rose);
}
#hud-spacer{flex:1}
#hud-lang{display:flex;gap:4px}
.lang-btn{
  padding:4px 12px;border-radius:20px;
  border:1px solid rgba(255,255,255,.12);
  background:transparent;color:var(--tm);
  font-size:.7rem;letter-spacing:.06em;cursor:pointer;transition:.2s;
  font-family:inherit;
}
.lang-btn.active{
  background:rgba(201,168,76,.15);
  border-color:rgba(201,168,76,.5);
  color:var(--gold);
}
#hud-step{font-size:.7rem;color:var(--tm);letter-spacing:.04em}

/* ═══════════════════════════════════
   PROGRESS DOTS
═══════════════════════════════════ */
#progress{
  position:fixed;bottom:88px;left:50%;
  transform:translateX(-50%);
  z-index:100;display:flex;gap:7px;align-items:center;
}
.pdot{
  width:7px;height:7px;border-radius:50%;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.15);
  cursor:pointer;transition:.3s var(--ease);
}
.pdot.now{
  background:var(--rose);border-color:var(--rose);
  box-shadow:0 0 10px rgba(255,77,77,.4);
  width:22px;border-radius:4px;
}

/* ═══════════════════════════════════
   STAGE & SCREENS
═══════════════════════════════════ */
#stage{
  position:fixed;inset:52px 0 80px 0;
  overflow:hidden;
}
.screen{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:28px 24px 32px;
  opacity:0;pointer-events:none;
  transform:translateY(32px);
  transition:opacity .55s var(--ease),transform .55s var(--ease);
  text-align:center;
}
.screen.active{
  opacity:1;pointer-events:all;
  transform:translateY(0);
}
.screen.leaving{
  opacity:0;transform:translateY(-28px);
  transition:opacity .35s var(--ease),transform .35s var(--ease);
}
/* Gallery screens: top-aligned, scrollable, no button overlap */
.screen--gallery{
  justify-content:flex-start;
  align-items:center;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding-top:20px;
  padding-bottom:120px; /* extra room so content clears nav + dots */
  scrollbar-width:none;
  gap:0;
}
.screen--gallery::-webkit-scrollbar{display:none}

/* Blobs */
.blob{
  position:absolute;border-radius:50%;
  filter:blur(90px);opacity:.16;pointer-events:none;
  animation:drift 14s ease-in-out infinite alternate;
}
@keyframes drift{
  from{transform:translate(0,0) scale(1)}
  to{transform:translate(25px,18px) scale(1.07)}
}

/* ═══════════════════════════════════
   TYPOGRAPHY
═══════════════════════════════════ */
.label{
  font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--tm);margin-bottom:18px;
}
.big{
  font-size:clamp(1.7rem,4.5vw,3.2rem);
  font-weight:700;line-height:1.28;letter-spacing:-.018em;
  color:var(--tp);max-width:720px;margin-bottom:0;
}
.sub{
  font-size:clamp(.9rem,2vw,1.06rem);
  font-weight:300;color:var(--tm);
  max-width:480px;margin-top:28px;line-height:2.1;
}
.quote-text{
  font-size:clamp(1.25rem,3.5vw,2rem);
  font-style:italic;font-weight:300;
  color:var(--tp);max-width:660px;line-height:1.65;
  position:relative;
}
.quote-text::before{
  content:'\201C';position:absolute;
  left:-.45em;top:-.1em;
  font-size:3em;color:var(--gold);opacity:.25;line-height:1;
}
body.rtl .quote-text::before{left:auto;right:-.45em}
.quote-attr{
  margin-top:24px;font-size:.72rem;letter-spacing:.14em;
  color:var(--tm);text-transform:uppercase;
}

/* ═══════════════════════════════════
   CHIPS
═══════════════════════════════════ */
.chips{
  display:flex;flex-wrap:wrap;gap:10px;
  justify-content:center;max-width:640px;margin-top:26px;
}
.chip{
  padding:11px 20px;border-radius:50px;
  border:1.5px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.04);
  font-size:.92rem;color:var(--ts);
  cursor:pointer;transition:.25s var(--ease);
  user-select:none;font-family:inherit;
}
.chip:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3);color:var(--tp)}
.chip.picked{
  background:var(--rose);border-color:var(--rose);
  color:#fff;font-weight:700;
  box-shadow:0 4px 22px rgba(255,77,77,.35);
}

/* ═══════════════════════════════════
   MEMORY PART CHIPS (screen 5)
═══════════════════════════════════ */
.part-chips{
  display:flex;flex-wrap:wrap;gap:12px;
  justify-content:center;max-width:580px;margin-top:26px;
}
.part-chip{
  padding:13px 22px;border-radius:14px;
  border:1.5px solid rgba(255,255,255,.13);
  background:rgba(255,255,255,.04);
  font-size:.9rem;color:var(--ts);
  cursor:pointer;transition:.25s var(--ease);
  user-select:none;font-family:inherit;
  display:flex;align-items:center;gap:8px;
}
.part-chip:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.28);color:var(--tp)}
.part-chip.picked{
  background:rgba(255,77,77,.12);
  border-color:var(--rose);color:var(--tp);
  box-shadow:0 4px 18px rgba(255,77,77,.2);
}
.part-chip .icon{font-size:1.1rem}

/* ═══════════════════════════════════
   COMPOSITION CARDS (screen 7)
═══════════════════════════════════ */
.comp-cards{
  display:flex;gap:14px;flex-wrap:wrap;
  justify-content:center;max-width:700px;margin-top:26px;
}
.comp-card{
  width:180px;padding:20px 16px 16px;
  border-radius:16px;
  border:1.5px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.04);
  cursor:pointer;transition:.25s var(--ease);
  display:flex;flex-direction:column;align-items:center;gap:10px;
}
.comp-card:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.28)}
.comp-card.picked{
  border-color:var(--rose);
  background:rgba(255,77,77,.1);
}
.comp-card svg{width:90px;height:60px}
.comp-card span{
  font-size:.8rem;color:var(--tm);
  text-align:center;line-height:1.4;
}
.comp-card.picked span{color:#fff}

/* ═══════════════════════════════════
   INSTRUCTION BOX
═══════════════════════════════════ */
.instr-box{
  margin-top:26px;padding:22px 28px;
  border-radius:18px;
  border:1.5px solid rgba(255,255,255,.09);
  background:rgba(255,255,255,.04);
  max-width:520px;text-align:left;
}
body.rtl .instr-box{text-align:right}
.instr-box ul{list-style:none;display:flex;flex-direction:column;gap:10px}
.instr-box li{
  display:flex;align-items:flex-start;gap:10px;
  font-size:.9rem;color:var(--ts);line-height:1.55;
}
.instr-box li::before{
  content:'→';color:var(--gold);flex-shrink:0;margin-top:1px;
}
body.rtl .instr-box li::before{content:'←'}

/* ── Gallery instruction bar (top) ─────────────── */
.gal-instruction{
  width:100%;max-width:840px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  border-radius:14px;
  padding:16px 22px;
  margin-bottom:24px;
  display:flex;align-items:center;gap:12px;
  flex-shrink:0;
}
.gal-instruction .gal-eye{
  font-size:1.5rem;flex-shrink:0;
}
.gal-instruction p{
  font-size:1rem;color:var(--ts);
  line-height:1.55;text-align:left;margin:0;
  font-weight:400;
}
body.rtl .gal-instruction p{text-align:right}
.gallery{
  display:flex;gap:18px;flex-wrap:wrap;
  justify-content:center;
  max-width:880px;width:100%;
  flex-shrink:0;
}
.gal-item{
  flex:1;min-width:min(240px,calc(100% - 36px));max-width:340px;
  border-radius:16px;
  border:1.5px solid rgba(255,255,255,.13);
  cursor:pointer;transition:.3s var(--ease);
  display:flex;flex-direction:column;
  background:rgba(255,255,255,.04);
  box-shadow:0 4px 24px rgba(0,0,0,.35);
}
.gal-item:hover{
  transform:scale(1.02);
  border-color:rgba(255,255,255,.4);
  background:rgba(255,255,255,.08);
  box-shadow:0 8px 40px rgba(0,0,0,.5);
}
.gal-item img{
  width:100%;
  height:auto;
  max-height:70vh;
  object-fit:contain;
  display:block;
  background:#0d0d1a;
  border-radius:16px 16px 0 0;
}
.gal-caption{
  padding:11px 16px;
  font-size:.8rem;
  font-weight:500;
  color:var(--ts);
  background:rgba(0,0,0,.7);
  line-height:1.45;
  text-align:center;
  border-top:1px solid rgba(255,255,255,.07);
  letter-spacing:.02em;
}
.gal-ask{
  margin-top:24px;
  margin-bottom:8px;
  padding:14px 28px;
  border-radius:50px;
  border:1px dashed rgba(255,255,255,.22);
  font-size:1rem;
  color:var(--tm);
  font-style:italic;
  max-width:520px;
  flex-shrink:0;
}

/* ═══════════════════════════════════
   REFLECTION
═══════════════════════════════════ */
.ref-wrap{
  width:100%;max-width:560px;margin-top:22px;
}
.ref-area{
  width:100%;height:120px;resize:none;
  background:rgba(255,255,255,.06);
  border:1.5px solid rgba(255,255,255,.12);
  border-radius:14px;padding:15px 17px;
  color:var(--tp);font-family:inherit;
  font-size:.95rem;line-height:1.6;outline:none;transition:.2s;
}
.ref-area:focus{border-color:var(--rose);background:rgba(255,77,77,.05)}
.ref-save{
  margin-top:10px;padding:10px 26px;
  border-radius:50px;border:none;cursor:pointer;
  background:#FF4D4D;color:#fff;
  font-family:inherit;font-size:.85rem;font-weight:700;
  transition:.2s;
}
.ref-save:hover{background:#e03333}
.ref-saved{
  display:none;margin-top:8px;
  font-size:.8rem;color:var(--tm);
}

/* ═══════════════════════════════════
   CLOSING
═══════════════════════════════════ */
.close-badge {
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 0; flex-shrink: 0; font-size: 2rem;
}
.close-btns{
  display:flex;gap:12px;flex-wrap:wrap;
  justify-content:center;margin-top:26px;
}
.btn-outline{
  padding:12px 24px;border-radius:50px;
  border:1.5px solid rgba(255,255,255,.2);
  background:transparent;color:var(--ts);
  font-family:inherit;font-size:.88rem;cursor:pointer;
  text-decoration:none;transition:.2s;
}
.btn-outline:hover{border-color:rgba(255,255,255,.5);color:var(--tp)}
.btn-red{
  padding:12px 24px;border-radius:50px;border:none;
  background:#FF4D4D;
  color:#fff;font-family:inherit;font-size:.88rem;
  font-weight:700;cursor:pointer;transition:.2s;
  text-decoration:none;
}
.btn-red:hover{background:#e03333}

/* ═══════════════════════════════════
   NAV BAR
═══════════════════════════════════ */
#nav-bar{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  height:80px;
  display:flex;align-items:center;justify-content:center;gap:14px;
  padding:0 24px;
  background:rgba(13,13,26,.95);
  border-top:1px solid rgba(255,255,255,.06);
  backdrop-filter:blur(12px);
}
#back-btn{
  width:48px;height:48px;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.06);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--tm);
  font-size:1.1rem;transition:.2s;flex-shrink:0;
}
#back-btn:hover{background:rgba(255,255,255,.14);color:var(--tp)}
#back-btn:disabled{opacity:.18;cursor:default;pointer-events:none}
#next-btn{
  padding:15px 52px;
  background:#FF4D4D;
  border:none;border-radius:50px;
  color:#fff;font-family:inherit;
  font-size:1rem;font-weight:800;
  letter-spacing:.03em;cursor:pointer;
  box-shadow:0 8px 32px rgba(255,77,77,.32);
  transition:.25s var(--ease);white-space:nowrap;
}
#next-btn:hover{
  background:#e03333;transform:translateY(-3px);
  box-shadow:0 12px 40px rgba(255,77,77,.42);
}
#next-btn:active{transform:translateY(0)}
#next-btn.gold-btn{
  background:#FF4D4D;color:#fff;
  box-shadow:0 8px 32px rgba(255,77,77,.32);
}

/* Fullscreen btn */
#fs-btn{
  position:fixed;top:60px;right:16px;z-index:200;
  width:36px;height:36px;border-radius:8px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.05);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--tm);
  font-size:.85rem;transition:.2s;
}
#fs-btn:hover{color:var(--tp);background:rgba(255,255,255,.12)}

/* ═══════════════════════════════════
   RESPONSIVE
═══════════════════════════════════ */
@media(max-width:760px){
  .gallery{
    flex-direction:column;
    align-items:center;
    gap:14px;
  }
  .gal-item{
    max-width:min(94vw,480px);
    min-width:unset;
    width:100%;
    flex:none;
  }
  .gal-item img{
    aspect-ratio:unset;
    height:auto;
    max-height:70vh;
  }
  .screen--gallery{
    padding-left:14px;
    padding-right:14px;
    padding-bottom:130px;
  }
  .gal-instruction{
    margin-bottom:16px;
  }
}
@media(max-width:600px){
  .big{font-size:clamp(1.6rem,8vw,2.4rem)}
  .comp-cards{gap:8px}
  .comp-card{width:140px}
  #next-btn{padding:14px 36px;font-size:.95rem}
  .gal-instruction{padding:10px 14px}
  .gal-ask{padding:10px 18px;font-size:.88rem}
}

/* ═══════════════════════════════════
   RTL — full direction logic
═══════════════════════════════════ */
/* 1. Root direction */
body.rtl{ direction:rtl; }
/* 2. Text alignment */
body.rtl .label,
body.rtl .big,
body.rtl .sub,
body.rtl .gal-ask,
body.rtl .gal-caption,
body.rtl .instr-box,
body.rtl .ref-wrap,
body.rtl .quote-attr,
body.rtl .close-btns { text-align:right; }
body.rtl .quote-text  { text-align:center; }
body.rtl .quote-text::before { left:auto; right:-.45em; }
/* 3. Instruction list arrows */
body.rtl .instr-box li::before { content:'←'; }
/* 4. HUD order */
body.rtl #hud { flex-direction:row-reverse; }
/* 5. Back-btn arrow flip */
body.rtl #back-btn svg { transform:scaleX(-1); }
/* 6. Progress dots right-to-left */
body.rtl #progress { flex-direction:row-reverse; direction:rtl; }
/* 7. Gallery instruction */
body.rtl .gal-instruction { flex-direction:row-reverse; }
body.rtl .gal-instruction p { text-align:right; }
/* 8. Chips / comp-cards */
body.rtl .chips,
body.rtl .part-chips,
body.rtl .comp-cards { flex-direction:row-reverse; flex-wrap:wrap; }
/* 9. Closing buttons */
body.rtl .close-btns { flex-direction:row-reverse; }
/* 10. Lang toggle — עברית on right in RTL */
body.rtl #hud-lang { flex-direction:row-reverse; }

/* ── Mobile gallery: single column so no artwork is ever cut ── */
@media (max-width: 520px) {
  .gallery {
    flex-direction: column !important;
    align-items: center !important;
  }
  .gal-item {
    min-width: unset !important;
    max-width: 100% !important;
    width: 100% !important;
  }
  .gal-item img {
    max-height: 55vw !important;
    height: auto !important;
    object-fit: contain !important;
  }
}


/* ── QA: Gallery mobile — single column, no artwork cropping ── */
@media (max-width: 600px) {
  .gallery {
    flex-direction: column !important;
    align-items: center !important;
    gap: 14px !important;
  }
  .gal-item {
    min-width: unset !important;
    max-width: 100% !important;
    width: 100% !important;
    flex: none !important;
  }
  .gal-item img {
    aspect-ratio: unset !important;
    object-fit: contain !important;
    max-height: 60vw !important;
    height: auto !important;
    background: #0d0d1a;
  }
  .screen--gallery {
    padding-bottom: 140px !important;
  }
}


/* ── QA: fs-btn RTL positioning ── */
body.rtl #fs-btn,
html[lang="he"] #fs-btn {
  right: auto !important;
  left: 16px !important;
}


/* ── QA: progress dots clearance on gallery screens ── */
.screen--gallery {
  padding-bottom: 140px;
}


/* ── Lesson 1.1: short notes on the personal screens ── */
.note-area{height:96px}
/* ── Lesson 1.1: drawn frame for a work without an image ── */
.gal-sketch{
  aspect-ratio:4/5;max-height:70vh;width:100%;
  display:flex;align-items:center;justify-content:center;
  background:#0d0d1a;border-radius:16px 16px 0 0;
}
.gal-sketch svg{width:62%;height:auto;opacity:.8}
@media (max-width:600px){ .gal-sketch{max-height:60vw} }
/* ── Lesson 1.1: ordered choices read right to left (colour, line, space) ── */
body.rtl #comp-cards,
body.rtl #look-chips{flex-direction:row !important}
/* ── Lesson 1.1: three direction cards stay on one row on phones ── */
@media (max-width:600px){
  .comp-cards{flex-wrap:nowrap !important;gap:8px}
  .comp-card{width:auto;flex:1 1 0;padding:14px 6px 12px}
  .comp-card svg{width:64px;height:44px}
}

function applyStrings(){
  const d = T.he;
  document.getElementById('t-back').textContent = d.back;
  document.getElementById('t-unit').textContent = d.unit;

  d.s.forEach((s,i)=>{
    const el = document.getElementById('s'+i);
    if(!el) return;

    const lbl = el.querySelector('.label') || document.getElementById('t'+i+'-label');
    if(lbl && s.label) lbl.textContent = s.label;

    const big = el.querySelector('.big') || document.getElementById('t'+i+'-big');
    if(big && s.big) big.innerHTML = s.big;

    const sub = el.querySelector('.sub');
    if(sub && s.sub) sub.innerHTML = s.sub;

    const qt = el.querySelector('.quote-text');
    if(qt && s.quote) qt.innerHTML = s.quote;
    const qa = el.querySelector('.quote-attr');
    if(qa && s.attr) qa.textContent = s.attr;

    ['cap1','cap2','cap3'].forEach(k=>{
      const e = document.getElementById('t'+i+'-'+k);
      if(e && s[k]) e.textContent = s[k];
    });
    if(s.ask){ const e=el.querySelector('.gal-ask'); if(e) e.textContent=s.ask; }

    if(s.chips){
      const btns = el.querySelectorAll('.chips .chip');
      s.chips.forEach((c,j)=>{ if(btns[j]) btns[j].textContent = c; });
    }
    if(s.comp){
      s.comp.forEach((txt,j)=>{ const sp=document.getElementById('cc'+j); if(sp) sp.textContent=txt; });
    }
    if(s.i){
      const items = el.querySelectorAll('.instr-box li');
      s.i.forEach((txt,j)=>{ if(items[j]) items[j].textContent = txt; });
    }

    if(s.ph){ const ta=el.querySelector('textarea'); if(ta) ta.placeholder=s.ph; }
    if(s.save){ const sb=el.querySelector('.ref-save'); if(sb) sb.textContent=s.save; }
    if(s.saved){ const sm=document.getElementById('ref-saved-msg'); if(sm) sm.textContent=s.saved; }

    if(s.back){ const ab=document.getElementById('t18-back'); if(ab) ab.textContent=s.back; }
    if(s.again){ const ag=document.getElementById('t18-again'); if(ag) ag.textContent=s.again; }
  });
}

/* ─── HUD ────────────────────────── */
function updateHud(){
  const display = cur < TOTAL-1 ? (cur+1)+' / '+(TOTAL-1) : '✓';
  document.getElementById('hud-step').textContent = display;
}

/* ─── DOTS + BUTTON — lesson-system.js ─── */
function buildDots()  { LS_buildDots(TOTAL, go); }
function refreshDots(){ LS_refreshDots(cur); }
function updateBtn()  { updateLessonBtn(document.getElementById('next-btn'), T.he.btn, cur, TOTAL-2, he); }

/* ─── BACK BUTTON ───────────────── */
function updateBackBtn(){ document.getElementById('back-btn').disabled = (cur === 0); }

/* ─── BG ─────────────────────────── */
function setBg(idx){
  const el = document.getElementById('s'+idx);
  if(el) document.body.style.background = el.dataset.bg || '#0d0d1a';
}

/* ─── NAVIGATION ────────────────── */
function go(n){
  if(n<0||n>=TOTAL||busy) return;
  busy = true;
  const prev = document.getElementById('s'+cur);
  prev.classList.add('leaving');
  setTimeout(()=>{
    prev.classList.remove('active','leaving');
    cur = n;
    const next = document.getElementById('s'+cur);
    next.classList.add('active');
    next.scrollTop = 0;
    setBg(cur);
    refreshDots();
    updateBtn();
    updateHud();
    updateBackBtn();
    busy = false;
  }, 380);
}
function advance(){ if(busy) return; if(cur === TOTAL-1) finishLesson(); else go(cur+1); }
function goBack(){  if(!busy && cur>0) go(cur-1); }

function restart(){
  choices = { look:'', experience:'', direction:'' };
  document.querySelectorAll('.chip,.comp-card').forEach(c=>c.classList.remove('picked'));
  document.querySelectorAll('textarea').forEach(t=>{ t.value=''; });
  document.getElementById('ref-saved-msg').style.display = 'none';
  go(0);
}

/* ─── INTERACTIONS ──────────────── */
function pick(btn, groupId){
  document.querySelectorAll('#'+groupId+' .chip').forEach(c=>c.classList.remove('picked'));
  btn.classList.add('picked');
  if(groupId==='look-chips') choices.look = btn.textContent;
  if(groupId==='exp-chips')  choices.experience = btn.textContent;
}

function pickComp(card){
  document.querySelectorAll('.comp-card').forEach(c=>c.classList.remove('picked'));
  card.classList.add('picked');
  choices.direction = card.querySelector('span').textContent;
}

function saveRef(){
  const txt = document.getElementById('reflection-input').value.trim();
  if(!txt) return;
  const key    = 'lesson-1-1-preview-reflection';
  const stored = JSON.parse(localStorage.getItem(key)||'[]');
  stored.push({ text:txt, date:new Date().toISOString(), choices });
  localStorage.setItem(key, JSON.stringify(stored));
  const msg = document.getElementById('ref-saved-msg');
  msg.style.display = 'block';
  msg.style.opacity = '1';
}

/* Frida Kahlo image: same sources as frida-kahlo.html */
document.getElementById('kahlo-img').addEventListener('error', function once(){
  this.removeEventListener('error', once);
  this.src = 'https://sspark.genspark.ai/cfimages?u1=ZeElcR2%2FvfCF8%2BGy2ndsqxagA4bvd6DZCC%2BLAo41bpKB%2B41CCVsUsHuQ%2BVHF9Xv7brKG0VH1jCb1GNc4xhUGkUyJWbXbb%2FHdhwrXAdWF2F6yDe60DM9ZOFiJ53A%2B3LccuONB5C78DQ%3D%3D&u2=3JcHSOK8GTyHT1ez&width=2560';
});

/* ─── FULLSCREEN ────────────────── */
function toggleFS(){
  if(!document.fullscreenElement)
    document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen();
}

/* ─── KEYBOARD ──────────────────── */
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='TEXTAREA') return;
  if(e.key===' ') { e.preventDefault(); advance(); }
  if(e.key==='ArrowRight') { e.preventDefault(); goBack(); }
  if(e.key==='ArrowLeft')  { e.preventDefault(); advance(); }
  if(e.key==='f'||e.key==='F') toggleFS();
});

/* ─── TOUCH SWIPE (RTL: swipe right = next) ─── */
document.addEventListener('touchstart', e=>{ touchX = e.touches[0].clientX; });
document.addEventListener('touchend',   e=>{
  if(e.target.tagName==='TEXTAREA') return;
  const dx = e.changedTouches[0].clientX - touchX;
  if(dx >  60) advance();
  if(dx < -60) goBack();
});

/* ─── INIT ──────────────────────── */
setLang('he');
document.body.classList.remove('lang-loading');
buildDots();
refreshDots();
updateBtn();
setBg(0);
updateBackBtn();
</script>
